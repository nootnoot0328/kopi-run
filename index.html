<title>Kopitiam Run</title>
<style>
:root{
  --ink:#241610; --jade:#0E6B52; --jade-deep:#073F2C; --tile:#E3E7DE;
  --paper:#F7F5EF; --amber:#E09A2B; --amber-deep:#8C5A06; --chilli:#B33127;
  --mute:#79736A; --line:#CBD0C4; --night:#141210;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--tile);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
/* iOS: kill double-tap zoom, long-press callout menus and text selection on controls */
button{font:inherit;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;appearance:none}
.app{max-width:560px;margin:0 auto}

header{background:var(--jade-deep);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  position:sticky;top:0;z-index:10}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border:none;
  border-radius:9px;padding:8px 11px;font-size:14px;font-weight:600}
.tab.on{background:var(--amber);color:var(--ink);font-weight:800}

main{padding:12px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{font-size:14px;color:var(--mute);margin-top:2px}
.label{font-size:13px;color:var(--mute);font-weight:600;margin:14px 0 6px}
.note{font-size:13px;color:var(--mute);line-height:1.45;margin-top:8px}
.hint{font-size:13px;color:var(--mute);text-align:right;max-width:130px;line-height:1.3}
.warn{background:#FBEAE7;border:1px solid var(--chilli);color:var(--chilli);
  padding:10px;border-radius:10px;font-size:14px;line-height:1.4;margin-bottom:12px}

.topline{display:flex;justify-content:space-between;align-items:flex-end}
.big{font-size:32px;font-weight:900;letter-spacing:-.03em;line-height:1}
.big span{font-size:15px;font-weight:600;color:var(--mute)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:13px;
  overflow:hidden;min-height:74px;text-align:left;padding:0}
.card.on{background:var(--jade);border-color:var(--jade)}
.card.changed{border-color:var(--amber)}
.cardmain{width:100%;background:none;border:none;padding:11px 30px 11px 11px;text-align:left}
.name{font-size:15px;font-weight:800;letter-spacing:-.01em}
.drink{font-size:13px;line-height:1.25;margin-top:3px;color:var(--mute)}
.card.on .name{color:#fff}
.card.on .drink{color:rgba(255,255,255,.82)}
.card.changed .drink{color:var(--amber-deep)}
.card.on.changed .drink{color:#FFE7BE}
.edit{position:absolute;top:6px;right:6px;width:27px;height:27px;border-radius:14px;
  background:rgba(255,255,255,.93);color:var(--ink);border:none;font-size:13px;font-weight:900;line-height:1}
.card.add{border-style:dashed;color:var(--mute);padding:11px}

.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-weight:700}
.link{background:none;border:none;color:var(--chilli);font-weight:700;font-size:14px;padding:0}

.primary{width:100%;margin-top:12px;padding:16px;border:none;border-radius:13px;
  background:var(--amber);color:var(--ink);font-size:17px;font-weight:800}
.primary:disabled{background:var(--line);color:#fff}
.ghost{width:100%;margin-top:10px;padding:13px;border-radius:13px;background:#fff;
  border:2px dashed var(--line);color:var(--ink);font-weight:700}

.empty{text-align:center;padding:32px 12px}
.empty p{color:var(--mute);line-height:1.5;font-size:15px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:50}
.sheet{width:100%;max-width:560px;background:var(--paper);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheethead h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sheethead .link{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:8px}
.bases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mods{margin-top:12px}
.mods.dim{opacity:.4}
.modrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:11px;padding:12px;
  font-size:16px;font-weight:700;text-align:left;color:var(--ink)}
.opt.sm{font-size:14px;font-weight:800;padding:10px 12px;min-width:76px}
.opt.on{background:var(--jade);border-color:var(--jade);color:#fff}
.opt:disabled{color:var(--line);border-color:var(--line)}
.opt em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--mute);margin-top:1px}
.opt.on em{color:rgba(255,255,255,.75)}
.opt:disabled em{color:var(--line)}
.preview{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;margin-top:12px}
.preview span{font-size:12px;opacity:.6;display:block}
.preview strong{font-size:20px;font-weight:800}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink);appearance:none}
textarea{height:76px;font-size:12px;font-family:ui-monospace,Menlo,monospace}

/* counter */
.dark{background:var(--night);color:#fff;min-height:80vh;min-height:80dvh;padding:14px;
  display:flex;flex-direction:column}
.dark h2{font-size:26px}
.progress{display:flex;justify-content:space-between;font-size:14px;color:rgba(255,255,255,.5)}
.bigline{flex:1;margin-top:14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);
  border-radius:16px;padding:22px 16px;text-align:left;color:#fff}
.qty{font-size:68px;font-weight:900;color:var(--amber);line-height:1;letter-spacing:-.04em}
.line{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:-.03em;margin-top:8px}
.whos{font-size:14px;color:rgba(255,255,255,.45);margin-top:14px}
.tapme{font-size:14px;color:rgba(255,255,255,.35);margin-top:18px}
.ghostdark{width:100%;margin-top:10px;padding:13px;border-radius:13px;background:transparent;
  border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);font-weight:700}

/* lists */
.list{margin-top:10px}
.listrow{display:flex;align-items:center;gap:11px;width:100%;padding:12px 0;background:none;
  border:none;border-bottom:1px solid var(--line);text-align:left;justify-content:flex-start}
.listrow.static{justify-content:space-between}
.listrow .box{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;background:#fff;
  color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.listrow.done .box{background:var(--jade);border-color:var(--jade)}
.listrow.done span:last-child{opacity:.4}
.listrow strong{display:block;font-size:15px;font-weight:700}
.listrow em{font-style:normal;font-size:14px;color:var(--mute)}

/* install nag + storage status */
.nag{margin:12px 12px 0;background:#FFF4E0;border:1px solid var(--amber);
  border-radius:12px;padding:12px}
.nag strong{display:block;font-size:14px;color:var(--amber-deep)}
.nag p{margin:6px 0 8px;font-size:13px;line-height:1.45;color:var(--ink)}
.nag .link{color:var(--mute)}
.status{border-radius:12px;padding:11px;border:1px solid var(--line);background:#fff}
.status strong{display:block;font-size:15px}
.status span{font-size:13px;color:var(--mute);line-height:1.4;display:block;margin-top:3px}
.status.ok{border-color:var(--jade)}
.status.ok strong{color:var(--jade)}
.status.bad{border-color:var(--chilli)}
.status.bad strong{color:var(--chilli)}

</style>
</head>

</script>
<script>
/* Ask for a persistent-storage exemption. Safari resets this per launch, so ask every time. */
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
</script>
<script>
/* Kopitiam Run — installable, offline, roster lives on this phone. */
const { h, render } = preact;
const { useState, useEffect, useMemo } = preactHooks;
const html = htm.bind(h);

/* ---------- storage: localStorage, with an in-memory fallback ---------- */
const mem = {};
let persisted = true;
const store = {
  get(k, d) {
    if (k in mem) return mem[k];
    try {
      const v = localStorage.getItem(k);
      return v == null ? d : JSON.parse(v);
    } catch (e) { persisted = false; return d; }
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { persisted = false; }
  },
};
const K = { roster: "kr.roster.v1", history: "kr.history.v1", draft: "kr.draft.v1" };

/* iOS: storage is only safe once the app is on the Home Screen.
   In Safari, WebKit wipes script-writable storage after 7 days of no interaction.
   Home Screen web apps are exempt and get their own storage, isolated from Safari. */
const standalone = (window.navigator.standalone === true) ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* ---------- drink vocabulary ---------- */
const BASES = [
  { id: "Kopi", milk: 1, sugar: 1, strength: 1 },
  { id: "Teh", milk: 1, sugar: 1, strength: 1 },
  { id: "Yuan Yang", milk: 1, sugar: 1, strength: 0 },
  { id: "Milo", milk: 0, sugar: 0, strength: 1 },
  { id: "Teh Tarik", milk: 0, sugar: 1, strength: 0 },
  { id: "Teh Halia", milk: 0, sugar: 1, strength: 0 },
  { id: "Horlicks", milk: 0, sugar: 1, strength: 0 },
  { id: "Bandung", milk: 0, sugar: 0, strength: 0 },
  { id: "Barley", milk: 0, sugar: 1, strength: 0 },
  { id: "Limau", milk: 0, sugar: 1, strength: 0 },
];
const GROUPS = [
  { key: "milk", gate: "milk", cards: [["O", "no milk"], ["C", "evaporated"]] },
  { key: "sugar", gate: "sugar", cards: [["Siu Dai", "less sweet"], ["Kosong", "no sugar"], ["Gah Dai", "extra sweet"]] },
  { key: "strength", gate: "strength", cards: [["Gau", "strong"], ["Po", "light"], ["Di Lo", "extra thick"]] },
];
const baseOf = (id) => BASES.find((b) => b.id === id);
const recite = (d) => [d.base, d.milk, d.sugar, d.strength, d.peng && "Peng"].filter(Boolean).join(" ");

/* ---------- usuals are learned from history, not curated by hand ---------- */
function relearn(roster, history) {
  const recent = history.slice(-30);
  return roster.map((p) => {
    const counts = {};
    recent.forEach((run) => run.orders.forEach((o) => {
      if (o.who === p.name) counts[o.drink] = (counts[o.drink] || 0) + 1;
    }));
    const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 3);
    return ranked.length ? { ...p, usuals: ranked } : p;
  });
}

/* ---------- app ---------- */
function App() {
  const [roster, setRoster] = useState(() => store.get(K.roster, []));
  const [history, setHistory] = useState(() => store.get(K.history, []));
  const [picked, setPicked] = useState(() => store.get(K.draft, {}));
  const [extras, setExtras] = useState([]);
  const [screen, setScreen] = useState("who");
  const [sheet, setSheet] = useState(null);

  useEffect(() => store.set(K.roster, roster), [roster]);
  useEffect(() => store.set(K.history, history), [history]);
  useEffect(() => store.set(K.draft, picked), [picked]);

  const orders = useMemo(() => [
    ...Object.keys(picked).map((who) => ({ who, drink: picked[who] })),
    ...extras.map((d) => ({ who: null, drink: d })),
  ], [picked, extras]);

  const lines = useMemo(() => {
    const m = new Map();
    orders.forEach((o) => { if (!m.has(o.drink)) m.set(o.drink, []); m.get(o.drink).push(o.who); });
    return [...m.entries()].map(([line, who]) => ({ line, who })).sort((a, b) => b.who.length - a.who.length);
  }, [orders]);

  function toggle(name) {
    setPicked((p) => {
      if (p[name]) { const q = { ...p }; delete q[name]; return q; }
      const person = roster.find((r) => r.name === name);
      return { ...p, [name]: person.usuals[0] };
    });
  }
  function setDrink(name, drink) { setPicked((p) => ({ ...p, [name]: drink })); setSheet(null); }
  function addPerson(name, drink) {
    setRoster((r) => r.some((x) => x.name === name) ? r : [...r, { name, usuals: [drink] }]);
    setPicked((p) => ({ ...p, [name]: drink }));
    setSheet(null);
  }
  function addExtra(d) { setExtras((e) => [...e, d]); setSheet(null); }

  function closeRun() {
    if (!orders.length) return;
    const run = { ts: Date.now(), orders: orders.filter((o) => o.who) };
    const nh = [...history, run].slice(-60);
    setHistory(nh);
    setRoster((r) => relearn(r, nh));
    setPicked({}); setExtras([]); setScreen("who");
  }

  return html`
    <div class="app">
      <header>
        <div class="brand">Kopitiam Run</div>
        <nav>
          ${[["who", "Who's in"], ["counter", "Counter"], ["back", "Hand back"], ["set", "Setup"]].map(
            ([id, l]) => html`<button class=${"tab" + (screen === id ? " on" : "")} onClick=${() => setScreen(id)}>${l}</button>`
          )}
        </nav>
      </header>

      ${!standalone && html`<${InstallBanner} />`}
      ${screen === "who" && html`<${Who} ...${{ roster, picked, extras, setExtras, orders, lines, toggle, setSheet, setScreen }} />`}
      ${screen === "counter" && html`<${Counter} lines=${lines} onDone=${() => setScreen("back")} />`}
      ${screen === "back" && html`<${HandBack} orders=${orders} onClose=${closeRun} />`}
      ${screen === "set" && html`<${Setup} ...${{ roster, setRoster, history, setHistory, setSheet }} />`}

      ${sheet && sheet.mode === "change" && html`
        <${ChangeSheet} person=${roster.find((r) => r.name === sheet.name)} current=${picked[sheet.name]}
          onPick=${(d) => setDrink(sheet.name, d)} onCancel=${() => setSheet(null)} />`}
      ${sheet && sheet.mode === "new" && html`
        <${NewSheet} onAdd=${addPerson} onExtra=${addExtra} onCancel=${() => setSheet(null)} />`}
    </div>`;
}

/* ---------- install nag: the roster is not safe until this is gone ---------- */
function InstallBanner() {
  const [hide, setHide] = useState(false);
  if (hide) return null;
  return html`
    <div class="nag">
      <strong>Running in the browser — your roster is not safe here.</strong>
      <p>${isIOS
        ? "Safari deletes stored data after 7 days without a visit. Home Screen apps are exempt. Tap the Share button, then Add to Home Screen, and open it from there from now on."
        : "Install the app from your browser menu so its data gets its own storage."}</p>
      <button class="link" onClick=${() => setHide(true)}>Dismiss for now</button>
    </div>`;
}

/* ---------- roster screen ---------- */
function Who({ roster, picked, extras, setExtras, orders, lines, toggle, setSheet, setScreen }) {
  const off = Object.keys(picked).filter((n) => {
    const p = roster.find((r) => r.name === n);
    return p && p.usuals.indexOf(picked[n]) === -1;
  }).length;

  if (!roster.length) return html`
    <main>
      <div class="empty">
        <h2>Nobody on the roster yet</h2>
        <p>Add people as you go on the next couple of runs. After that, one tap each is all it takes —
        the app works out everyone's usual from what they actually ordered.</p>
        <button class="primary" onClick=${() => setSheet({ mode: "new" })}>Add the first person</button>
      </div>
    </main>`;

  return html`
    <main>
      <div class="topline">
        <div>
          <div class="big">${orders.length}<span> in</span></div>
          <div class="sub">${lines.length} lines${off ? ` · ${off} not their usual` : ""}</div>
        </div>
        <div class="hint">Grey = not tapped yet</div>
      </div>

      <div class="grid">
        ${roster.map((p) => {
          const d = picked[p.name];
          const on = !!d;
          const changed = on && p.usuals.indexOf(d) === -1;
          return html`
            <div class=${"card" + (on ? " on" : "") + (changed ? " changed" : "")}>
              <button class="cardmain" onClick=${() => toggle(p.name)}>
                <div class="name">${p.name}</div>
                <div class="drink">${d || p.usuals[0]}</div>
              </button>
              ${on && html`<button class="edit" onClick=${() => setSheet({ mode: "change", name: p.name })}>✎</button>`}
            </div>`;
        })}
        <button class="card add" onClick=${() => setSheet({ mode: "new" })}>
          <div class="name">+ Someone else</div>
          <div class="drink">New person, or a spare</div>
        </button>
      </div>

      ${extras.length > 0 && html`
        <div class="panel">
          <div class="label">Spare drinks, no owner</div>
          ${extras.map((d, i) => html`
            <div class="row">
              <span>${d}</span>
              <button class="link" onClick=${() => setExtras((x) => x.filter((_, k) => k !== i))}>remove</button>
            </div>`)}
        </div>`}

      <button class="primary" disabled=${!orders.length} onClick=${() => setScreen("counter")}>
        Done — show at counter
      </button>
    </main>`;
}

/* ---------- sheets ---------- */
function Shell({ title, children, onCancel }) {
  return html`
    <div class="scrim" onClick=${(e) => e.target.className === "scrim" && onCancel()}>
      <div class="sheet">
        <div class="sheethead"><h3>${title}</h3><button class="link" onClick=${onCancel}>Cancel</button></div>
        ${children}
      </div>
    </div>`;
}

function ChangeSheet({ person, current, onPick, onCancel }) {
  const [building, setBuilding] = useState(false);
  if (!person) return null;
  if (building) return html`<${Builder} title=${person.name + " — today"} onCancel=${() => setBuilding(false)} onAdd=${onPick} />`;
  return html`
    <${Shell} title=${person.name + " wants something else"} onCancel=${onCancel}>
      <div class="label">Their usual drinks</div>
      <div class="stack">
        ${person.usuals.map((u) => html`
          <button class=${"opt" + (u === current ? " on" : "")} onClick=${() => onPick(u)}>${u}</button>`)}
      </div>
      <button class="ghost" onClick=${() => setBuilding(true)}>Build something different</button>
    <//>`;
}

function NewSheet({ onAdd, onExtra, onCancel }) {
  const [name, setName] = useState("");
  const [mode, setMode] = useState(null);
  if (mode === "person") return html`<${Builder} title=${"What does " + name + " have?"} onCancel=${() => setMode(null)} onAdd=${(d) => onAdd(name.trim(), d)} />`;
  if (mode === "extra") return html`<${Builder} title="Spare drink, no owner" onCancel=${() => setMode(null)} onAdd=${onExtra} />`;
  return html`
    <${Shell} title="Someone else" onCancel=${onCancel}>
      <input value=${name} placeholder="Name" onInput=${(e) => setName(e.target.value)} />
      <button class="primary" disabled=${!name.trim()} onClick=${() => setMode("person")}>Add to roster</button>
      <div class="note">They become a card next time, with this as their usual.</div>
      <button class="ghost" onClick=${() => setMode("extra")}>Just a spare drink, nobody's</button>
    <//>`;
}

function Builder({ title, onAdd, onCancel }) {
  const [d, setD] = useState({ base: null, milk: "", sugar: "", strength: "", peng: false });
  const b = d.base ? baseOf(d.base) : null;
  const line = d.base ? recite(d) : "";
  return html`
    <${Shell} title=${title} onCancel=${onCancel}>
      <div class="bases">
        ${BASES.map((x) => html`
          <button class=${"opt sm" + (d.base === x.id ? " on" : "")}
            onClick=${() => setD({ base: x.id, milk: "", sugar: "", strength: "", peng: false })}>${x.id}</button>`)}
      </div>
      <div class=${"mods" + (b ? "" : " dim")}>
        ${GROUPS.map((g) => html`
          <div class="modrow">
            ${g.cards.map(([val, note]) => {
              const dead = !b || !b[g.gate];
              const on = d[g.key] === val;
              return html`<button class=${"opt sm" + (on ? " on" : "")} disabled=${dead}
                onClick=${() => setD((p) => ({ ...p, [g.key]: p[g.key] === val ? "" : val }))}>
                ${val}<em>${note}</em></button>`;
            })}
          </div>`)}
        <div class="modrow">
          <button class=${"opt sm" + (d.peng ? " on" : "")} disabled=${!b}
            onClick=${() => setD((p) => ({ ...p, peng: !p.peng }))}>Peng<em>iced</em></button>
        </div>
      </div>
      <div class="preview"><span>The stall will hear</span><strong>${line || "—"}</strong></div>
      <button class="primary" disabled=${!d.base} onClick=${() => onAdd(line)}>Use this</button>
    <//>`;
}

/* ---------- counter ---------- */
function Counter({ lines, onDone }) {
  const [i, setI] = useState(0);
  if (!lines.length) return html`<main><div class="empty"><p>Nobody tapped yet.</p></div></main>`;
  if (i >= lines.length) return html`
    <div class="dark">
      <h2>That's everything.</h2>
      <button class="primary" onClick=${onDone}>Drinks are ready</button>
      <button class="ghostdark" onClick=${() => setI(0)}>Read again</button>
    </div>`;
  const g = lines[i];
  return html`
    <div class="dark">
      <div class="progress"><span>Line ${i + 1} of ${lines.length}</span><span>${lines.length - i - 1} more</span></div>
      <button class="bigline" onClick=${() => setI(i + 1)}>
        <div class="qty">${g.who.length}×</div>
        <div class="line">${g.line}</div>
        <div class="whos">${g.who.filter(Boolean).join(" · ")}</div>
        <div class="tapme">Tap when the uncle has it</div>
      </button>
      <button class="ghostdark" onClick=${() => setI(Math.max(0, i - 1))}>He asked again</button>
    </div>`;
}

/* ---------- hand back ---------- */
function HandBack({ orders, onClose }) {
  const [done, setDone] = useState([]);
  return html`
    <main>
      <h2>Whose cup is whose</h2>
      <div class="sub">${done.length} of ${orders.length} handed out</div>
      <div class="list">
        ${orders.map((o, i) => {
          const on = done.indexOf(i) > -1;
          return html`
            <button class=${"listrow" + (on ? " done" : "")}
              onClick=${() => setDone((d) => on ? d.filter((x) => x !== i) : [...d, i])}>
              <span class="box">${on ? "✓" : ""}</span>
              <span><strong>${o.who || "Spare"}</strong><em>${o.drink}</em></span>
            </button>`;
        })}
      </div>
      <button class="primary" onClick=${onClose}>Finish run and learn from it</button>
      <div class="note">Closing the run updates everyone's usual from what they actually took.</div>
    </main>`;
}

/* ---------- setup / backup ---------- */
function Setup({ roster, setRoster, history, setHistory }) {
  const [io, setIo] = useState("");
  const [grant, setGrant] = useState(null);
  const dump = JSON.stringify({ roster, history });

  useEffect(() => {
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(setGrant).catch(() => setGrant(null));
    }
  }, []);

  function importNow() {
    try {
      const o = JSON.parse(io);
      if (Array.isArray(o.roster)) setRoster(o.roster);
      if (Array.isArray(o.history)) setHistory(o.history);
      setIo("");
      alert("Restored.");
    } catch (e) { alert("That isn't a valid backup."); }
  }

  return html`
    <main>
      <h2>Setup</h2>
      ${!persisted && html`<div class="warn">This browser is blocking storage. Your roster will vanish when you close the tab. Use the backup box below.</div>`}

      <div class="label">Storage</div>
      <div class=${"status " + (standalone ? "ok" : "bad")}>
        <strong>${standalone ? "Installed on the Home Screen" : "Running in the browser"}</strong>
        <span>${standalone
          ? "Exempt from Safari's 7-day data wipe. This is where the roster belongs."
          : "At risk. Share → Add to Home Screen, then open it from the icon."}</span>
      </div>
      <div class="note">
        Persistent-storage grant: ${grant === null ? "unknown" : grant ? "yes" : "not granted"}.
        ${" "}Deleting the Home Screen icon deletes the roster with it, and iCloud does not back it up.
      </div>

      <div class="label">Roster · ${roster.length} people, ${history.length} runs remembered</div>
      <div class="list">
        ${roster.map((p) => html`
          <div class="listrow static">
            <span><strong>${p.name}</strong><em>${p.usuals.join(" / ")}</em></span>
            <button class="link" onClick=${() => confirm("Remove " + p.name + "?") && setRoster((r) => r.filter((x) => x.name !== p.name))}>remove</button>
          </div>`)}
      </div>

      <div class="label">Backup</div>
      <div class="note">Copy this somewhere safe now and then. It's the only copy that exists.</div>
      <textarea readonly onFocus=${(e) => e.target.select()} value=${dump}></textarea>
      <div class="label">Restore</div>
      <textarea placeholder="Paste a backup here" value=${io} onInput=${(e) => setIo(e.target.value)}></textarea>
      <button class="ghost" disabled=${!io.trim()} onClick=${importNow}>Restore from backup</button>
    </main>`;
}

render(html`<${App} />`, document.getElementById("root"));

</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
