<title>Kopitiam Run</title>
<style>
:root{
  --ink:#241610; --jade:#0E6B52; --jade-deep:#073F2C; --tile:#E3E7DE;
  --paper:#F7F5EF; --amber:#E09A2B; --amber-deep:#8C5A06; --chilli:#B33127;
  --mute:#79736A; --line:#CBD0C4; --night:#141210;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--tile);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
/* iOS: kill double-tap zoom, long-press callout menus and text selection on controls */
button{font:inherit;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;appearance:none}
.app{max-width:560px;margin:0 auto}

header{background:var(--jade-deep);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  position:sticky;top:0;z-index:10}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border:none;
  border-radius:9px;padding:8px 11px;font-size:14px;font-weight:600}
.tab.on{background:var(--amber);color:var(--ink);font-weight:800}

main{padding:12px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{font-size:14px;color:var(--mute);margin-top:2px}
.label{font-size:13px;color:var(--mute);font-weight:600;margin:14px 0 6px}
.note{font-size:13px;color:var(--mute);line-height:1.45;margin-top:8px}
.hint{font-size:13px;color:var(--mute);text-align:right;max-width:130px;line-height:1.3}
.warn{background:#FBEAE7;border:1px solid var(--chilli);color:var(--chilli);
  padding:10px;border-radius:10px;font-size:14px;line-height:1.4;margin-bottom:12px}

.topline{display:flex;justify-content:space-between;align-items:flex-end}
.big{font-size:32px;font-weight:900;letter-spacing:-.03em;line-height:1}
.big span{font-size:15px;font-weight:600;color:var(--mute)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:13px;
  overflow:hidden;min-height:74px;text-align:left;padding:0}
.card.on{background:var(--jade);border-color:var(--jade)}
.card.changed{border-color:var(--amber)}
.cardmain{width:100%;background:none;border:none;padding:11px 30px 11px 11px;text-align:left}
.name{font-size:15px;font-weight:800;letter-spacing:-.01em}
.drink{font-size:13px;line-height:1.25;margin-top:3px;color:var(--mute)}
.card.on .name{color:#fff}
.card.on .drink{color:rgba(255,255,255,.82)}
.card.changed .drink{color:var(--amber-deep)}
.card.on.changed .drink{color:#FFE7BE}
.edit{position:absolute;top:6px;right:6px;width:27px;height:27px;border-radius:14px;
  background:rgba(255,255,255,.93);color:var(--ink);border:none;font-size:13px;font-weight:900;line-height:1}
.card.add{border-style:dashed;color:var(--mute);padding:11px}

.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-weight:700}
.link{background:none;border:none;color:var(--chilli);font-weight:700;font-size:14px;padding:0}

.primary{width:100%;margin-top:12px;padding:16px;border:none;border-radius:13px;
  background:var(--amber);color:var(--ink);font-size:17px;font-weight:800}
.primary:disabled{background:var(--line);color:#fff}
.ghost{width:100%;margin-top:10px;padding:13px;border-radius:13px;background:#fff;
  border:2px dashed var(--line);color:var(--ink);font-weight:700}

.empty{text-align:center;padding:32px 12px}
.empty p{color:var(--mute);line-height:1.5;font-size:15px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:50}
.sheet{width:100%;max-width:560px;background:var(--paper);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheethead h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sheethead .link{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:8px}
.bases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mods{margin-top:12px}
.mods.dim{opacity:.4}
.modrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:11px;padding:12px;
  font-size:16px;font-weight:700;text-align:left;color:var(--ink)}
.opt.sm{font-size:14px;font-weight:800;padding:10px 12px;min-width:76px}
.opt.on{background:var(--jade);border-color:var(--jade);color:#fff}
.opt:disabled{color:var(--line);border-color:var(--line)}
.opt em{display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--mute);margin-top:1px}
.opt.on em{color:rgba(255,255,255,.75)}
.opt:disabled em{color:var(--line)}
.preview{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;margin-top:12px}
.preview span{font-size:12px;opacity:.6;display:block}
.preview strong{font-size:20px;font-weight:800}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink);appearance:none}
textarea{height:76px;font-size:12px;font-family:ui-monospace,Menlo,monospace}

/* counter */
.dark{background:var(--night);color:#fff;min-height:80vh;min-height:80dvh;padding:14px;
  display:flex;flex-direction:column}
.dark h2{font-size:26px}
.progress{display:flex;justify-content:space-between;font-size:14px;color:rgba(255,255,255,.5)}
.bigline{flex:1;margin-top:14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);
  border-radius:16px;padding:22px 16px;text-align:left;color:#fff}
.qty{font-size:68px;font-weight:900;color:var(--amber);line-height:1;letter-spacing:-.04em}
.line{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:-.03em;margin-top:8px}
.whos{font-size:14px;color:rgba(255,255,255,.45);margin-top:14px}
.tapme{font-size:14px;color:rgba(255,255,255,.35);margin-top:18px}
.ghostdark{width:100%;margin-top:10px;padding:13px;border-radius:13px;background:transparent;
  border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);font-weight:700}

/* lists */
.list{margin-top:10px}
.listrow{display:flex;align-items:center;gap:11px;width:100%;padding:12px 0;background:none;
  border:none;border-bottom:1px solid var(--line);text-align:left;justify-content:flex-start}
.listrow.static{justify-content:space-between}
.listrow .box{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;background:#fff;
  color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.listrow.done .box{background:var(--jade);border-color:var(--jade)}
.listrow.done span:last-child{opacity:.4}
.listrow strong{display:block;font-size:15px;font-weight:700}
.listrow em{font-style:normal;font-size:14px;color:var(--mute)}

/* install nag + storage status */
.nag{margin:12px 12px 0;background:#FFF4E0;border:1px solid var(--amber);
  border-radius:12px;padding:12px}
.nag strong{display:block;font-size:14px;color:var(--amber-deep)}
.nag p{margin:6px 0 8px;font-size:13px;line-height:1.45;color:var(--ink)}
.nag .link{color:var(--mute)}
.status{border-radius:12px;padding:11px;border:1px solid var(--line);background:#fff}
.status strong{display:block;font-size:15px}
.status span{font-size:13px;color:var(--mute);line-height:1.4;display:block;margin-top:3px}
.status.ok{border-color:var(--jade)}
.status.ok strong{color:var(--jade)}
.status.bad{border-color:var(--chilli)}
.status.bad strong{color:var(--chilli)}

/* free-text drinks that have been used before */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--amber);border-radius:999px;padding:9px 13px;
  font-size:14px;font-weight:700;color:var(--amber-deep)}
.bases.dim,.bases.dim .opt{opacity:.45}

/* icons */
.ico{flex-shrink:0;display:block}
.drinkrow{display:flex;align-items:center;gap:6px;min-width:0}
.drinkrow .drink{margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.base{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;
  font-size:12px;line-height:1.15;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip.name{border-color:var(--jade);color:var(--jade)}
.chip.name.taken{background:var(--tile);border-color:var(--line);color:var(--mute)}
.chip.oneoff{border-color:var(--mute);color:var(--mute)}
.preview{display:flex;align-items:center;gap:12px}
.preview>div{min-width:0}


.qrbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;
  margin-top:10px;text-align:center}
.qr{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:6px}
.btnrow{display:flex;gap:8px}
.btnrow .ghost{margin-top:10px}

/* groups */
.groupbar{margin:12px 0 4px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
.chip.grp{border-color:var(--line);color:var(--mute);white-space:nowrap}
.chip.grp.on{background:var(--jade);border-color:var(--jade);color:#fff}
.chip.grp.static{cursor:default;background:#fff;color:var(--ink);border-color:var(--jade)}
.chip .x{background:none;border:none;color:var(--chilli);font-size:17px;font-weight:800;
  padding:0 0 0 4px;line-height:1}
.warnline{color:var(--amber-deep);background:#FFF4E0;border-radius:9px;padding:8px;margin-top:8px}
.rowmain{flex:1;background:none;border:none;text-align:left;padding:0;min-width:0}
.rowmain .tags{display:block;font-size:12px;color:var(--jade);margin-top:1px}

/* counter: one card per drink type, all its variants visible together */
.famhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:2px solid rgba(255,255,255,.16);padding-bottom:8px;margin-bottom:12px}
.famname{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}
.famtotal{font-size:52px;font-weight:900;color:var(--amber);line-height:1;letter-spacing:-.04em}
.sololine{display:flex;align-items:center;gap:12px;margin:6px 0}
.sololine span{font-size:34px;font-weight:900;line-height:1.05;letter-spacing:-.03em}
.varrow{display:flex;align-items:center;gap:11px;margin-top:10px}
.varqty{font-size:30px;font-weight:900;color:var(--amber);min-width:30px;line-height:1}
.varline{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.varwho{font-size:12px;color:rgba(255,255,255,.4);margin:2px 0 0 41px}
.donerecap{margin:14px 0 4px;font-size:17px;line-height:1.6;color:rgba(255,255,255,.75)}
.donerecap b{color:var(--amber);font-size:20px}

/* counter: read-out vs check-off */
.modebar{display:flex;gap:6px;margin-bottom:12px}
.mtab{flex:1;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);border:none;
  border-radius:10px;padding:10px 8px;font-size:14px;font-weight:700}
.mtab.on{background:var(--amber);color:var(--ink);font-weight:800}
.tally{display:flex;align-items:baseline;gap:10px;padding:10px 0 14px;
  border-bottom:2px solid rgba(255,255,255,.14)}
.tallynum{font-size:46px;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--amber)}
.tallynum em{font-style:normal;font-size:24px;color:rgba(255,255,255,.45)}
.tallytxt{font-size:15px;color:rgba(255,255,255,.6)}
.tally.ok .tallynum{color:#5FD39B}
.tally.ok .tallytxt{color:#5FD39B;font-weight:800}
.checklist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:12px 0}
.checkfam{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin:14px 0 6px}
.checkrow{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:10px;margin-bottom:8px}
.checkrow.full{background:rgba(95,211,155,.12);border-color:rgba(95,211,155,.45)}
.checkhead{display:flex;align-items:center;gap:9px}
.checkline{flex:1;font-size:18px;font-weight:800;letter-spacing:-.02em;min-width:0}
.checkqty{font-size:14px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.checkrow.full .checkqty{color:#5FD39B}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.dot{width:40px;height:40px;border-radius:11px;background:transparent;color:var(--night);
  border:2px solid rgba(255,255,255,.28);font-size:19px;font-weight:900;line-height:1}

<script>
/* Kopitiam Run — installable, offline, roster lives on this phone. */
const { h, render } = preact;
const { useState, useEffect, useMemo } = preactHooks;
const html = htm.bind(h);

/* ---------- storage: localStorage, with an in-memory fallback ---------- */
const mem = {};
let persisted = true;
const store = {
  get(k, d) {
    if (k in mem) return mem[k];
    try {
      const v = localStorage.getItem(k);
      return v == null ? d : JSON.parse(v);
    } catch (e) { persisted = false; return d; }
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { persisted = false; }
  },
};
const K = { roster: "kr.roster.v1", history: "kr.history.v1", draft: "kr.draft.v1",
            custom: "kr.custom.v1", groups: "kr.groups.v1", active: "kr.active.v1" };

const inGroup = (p, g) => !g || (p.groups || []).indexOf(g) > -1;

/* Anything the kopi/teh grammar can't express — canned drinks, calamansi ice
   lemon tea, whatever the stall happens to sell. Typed once, then reusable,
   because two spellings of the same thing become two lines at the counter. */
const tidy = (s) => s.trim().replace(/\s+/g, " ");

/* iOS: storage is only safe once the app is on the Home Screen.
   In Safari, WebKit wipes script-writable storage after 7 days of no interaction.
   Home Screen web apps are exempt and get their own storage, isolated from Safari. */
const standalone = (window.navigator.standalone === true) ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* ---------- drink vocabulary ---------- */
const BASES = [
  { id: "Kopi", milk: 1, sugar: 1, strength: 1 },
  { id: "Teh", milk: 1, sugar: 1, strength: 1 },
  { id: "Yuan Yang", milk: 1, sugar: 1, strength: 0 },
  { id: "Milo", milk: 0, sugar: 0, strength: 1 },
  { id: "Teh Tarik", milk: 0, sugar: 1, strength: 0 },
  { id: "Teh Halia", milk: 0, sugar: 1, strength: 0 },
  { id: "Horlicks", milk: 0, sugar: 1, strength: 0 },
  { id: "Bandung", milk: 0, sugar: 0, strength: 0 },
  { id: "Barley", milk: 0, sugar: 1, strength: 0 },
  { id: "Limau", milk: 0, sugar: 1, strength: 0 },
];
const GROUPS = [
  { key: "milk", gate: "milk", cards: [["O", "no milk"], ["C", "evaporated"]] },
  { key: "sugar", gate: "sugar", cards: [["Siu Dai", "less sweet"], ["Kosong", "no sugar"], ["Gah Dai", "extra sweet"]] },
  { key: "strength", gate: "strength", cards: [["Gau", "strong"], ["Po", "light"], ["Di Lo", "extra thick"]] },
];
const baseOf = (id) => BASES.find((b) => b.id === id);

/* ---------- sharing ----------
   Deliberately NOT the run history. History exists only to compute usuals —
   it's 60 runs of raw log, far past what a QR holds. The roster IS the
   compressed history, so we ship the derivative and it fits in one code. */
const clean = (x) => String(x).replace(/[|~#@>]/g, " ").replace(/\s+/g, " ").trim();

function encodeShare(roster, customs, depth, groups) {
  const parts = roster.filter((p) => p.usuals && p.usuals.length)
    .map((p) => [clean(p.name)].concat(p.usuals.slice(0, depth || 3).map(clean)).join("~"));
  (groups || []).forEach((g) => {
    const members = roster.filter((p) => inGroup(p, g)).map((p) => clean(p.name));
    if (members.length) parts.push("@" + clean(g) + ">" + members.join(">"));
  });
  (customs || []).forEach((c) => parts.push("#" + clean(c)));
  return "KR1|" + parts.join("|");
}

/* A QR holds a few hundred bytes. Rather than fail on a big roster, shed the
   least useful parts first: third usual, then second, then the off-menu list. */
function bestShare(roster, customs) {
  const tries = [
    { d: 3, c: customs, note: "" },
    { d: 2, c: customs, note: "Two usuals each — the roster was too big for three." },
    { d: 1, c: customs, note: "Top usual each only — the roster was too big for more." },
    { d: 1, c: [], note: "Top usual each, off-menu drinks left out. Use the text box to send everything." },
  ];
  /* Prefer a code that stays comfortable to scan off a phone screen (<= 81
     modules) over one that carries every last usual. Fall back to any that fits. */
  const made = [];
  for (const t of tries) {
    const text = encodeShare(roster, t.c, t.d, t.g);
    const m = QR.matrix(text);
    if (!m) continue;
    if (m.length <= 81) return { text: text, note: t.note, fits: true };
    made.push({ text: text, note: t.note, fits: true });
  }
  if (made.length) return made[made.length - 1];
  return { text: encodeShare(roster, customs, 3, groups), note: "", fits: false };
}

function decodeShare(text) {
  const t = String(text || "").trim();
  if (t.indexOf("KR1|") !== 0) return null;
  const people = [], cust = [], groups = [];
  t.slice(4).split("|").filter(Boolean).forEach((chunk) => {
    if (chunk.charAt(0) === "#") { cust.push(chunk.slice(1)); return; }
    if (chunk.charAt(0) === "@") {
      const f = chunk.slice(1).split(">").filter(Boolean);
      if (f.length > 1) groups.push({ name: f[0], members: f.slice(1) });
      return;
    }
    const f = chunk.split("~").filter(Boolean);
    if (f.length > 1) people.push({ name: f[0], usuals: f.slice(1) });
  });
  return people.length || cust.length || groups.length
    ? { people: people, cust: cust, groups: groups } : null;
}

function QRSvg({ text, size }) {
  const m = QR.matrix(text);
  if (!m) return html`<div class="warn">Too many people to fit in one QR code. Use the text box below instead.</div>`;
  const n = m.length, q = 4, tot = n + q * 2;
  let path = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) path += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
  return html`<svg class="qr" viewBox=${"0 0 " + tot + " " + tot} width=${size} height=${size}
    shape-rendering="crispEdges" role="img" aria-label="roster QR code">
    <rect width=${tot} height=${tot} fill="#fff"/><path d=${path} fill="#241610"/></svg>`;
}

/* ---------- icons ----------
   Only encode what a drink actually looks like: liquid colour, milk or no milk,
   cup or glass. Sugar and strength get no glyph — an icon that pretends to show
   "Gah Dai" is decoration wearing a badge. Those stay as text. */
const LIQUID = {
  "Kopi":      { "": "#7A4A2B", O: "#2E1B10", C: "#A0714A" },
  "Teh":       { "": "#B07338", O: "#C68A34", C: "#C79A66" },
  "Yuan Yang": { "": "#8E5730", O: "#4A2D19", C: "#A87A50" },
  "Milo":      { "": "#5B3A21" },
  "Teh Tarik": { "": "#C09263" },
  "Teh Halia": { "": "#C0883C" },
  "Horlicks":  { "": "#C4A47A" },
  "Bandung":   { "": "#E07AA0" },
  "Barley":    { "": "#DCCFA8" },
  "Limau":     { "": "#C6C64A" },
};
/* which bases have milk in them by default, so the cream band means something */
const CREAMY = { Kopi: 1, Teh: 1, "Yuan Yang": 1, Milo: 1, "Teh Tarik": 1, Horlicks: 1, Bandung: 1 };

function parseDrink(line) {
  if (!line) return null;
  const names = BASES.map((b) => b.id).sort((a, b) => b.length - a.length);
  const base = names.find((n) => line.toLowerCase().indexOf(n.toLowerCase()) === 0);
  if (!base) return null;
  const rest = line.slice(base.length);
  return {
    base,
    milk: /\bO\b/.test(rest) ? "O" : /\bC\b/.test(rest) ? "C" : "",
    peng: /\bPeng\b/i.test(rest),
  };
}

function DrinkIcon({ line, size }) {
  const S = size || 30;
  const p = parseDrink(line);
  const vb = "0 0 40 40";
  if (!p) {
    /* free text: a plain unlabelled cup, honestly says "we don't know" */
    return html`<svg class="ico" width=${S} height=${S} viewBox=${vb} aria-hidden="true">
      <path d="M11 15h18v13a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4z" fill="none" stroke="#B9BEB2" stroke-width="2"/>
      <path d="M29 18h3a3 3 0 0 1 0 6h-3" fill="none" stroke="#B9BEB2" stroke-width="2"/>
    </svg>`;
  }
  const col = (LIQUID[p.base] || {})[p.milk] || (LIQUID[p.base] || {})[""] || "#7A4A2B";
  const cream = p.milk !== "O" && CREAMY[p.base];

  if (p.peng) {
    /* tall glass, straw, ice */
    return html`<svg class="ico" width=${S} height=${S} viewBox=${vb} aria-hidden="true">
      <path d="M24 4 18 16" stroke="#E09A2B" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M12 12h16l-2 24a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z" fill=${col}/>
      ${cream && html`<path d="M12 12h16l-.5 5h-15z" fill="#F2E4CE" opacity=".85"/>`}
      <rect x="15" y="20" width="5" height="5" rx="1" fill="#fff" opacity=".55"/>
      <rect x="21" y="27" width="4.5" height="4.5" rx="1" fill="#fff" opacity=".45"/>
      <path d="M12 12h16l-2 24a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z" fill="none" stroke="#241610" stroke-width="1.6" opacity=".35"/>
    </svg>`;
  }
  /* ceramic cup, saucer, steam */
  return html`<svg class="ico" width=${S} height=${S} viewBox=${vb} aria-hidden="true">
    <path d="M15 3c-2 3 2 4 0 7M23 4c-2 3 2 4 0 7" fill="none" stroke="#E09A2B" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <path d="M9 14h20v12a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6z" fill=${col}/>
    ${cream && html`<path d="M9 14h20v4H9z" fill="#F2E4CE" opacity=".85"/>`}
    <path d="M9 14h20v12a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6z" fill="none" stroke="#241610" stroke-width="1.6" opacity=".35"/>
    <path d="M29 17h3.5a3.5 3.5 0 0 1 0 7H29" fill="none" stroke="#241610" stroke-width="1.8" opacity=".35"/>
    <path d="M6 35h28" stroke="#241610" stroke-width="2" opacity=".25" stroke-linecap="round"/>
  </svg>`;
}
const recite = (d) => [d.base, d.milk, d.sugar, d.strength, d.peng && "Peng"].filter(Boolean).join(" ");

/* ---------- usuals are learned from history, not curated by hand ---------- */
function relearn(roster, history) {
  const recent = history.slice(-30);
  return roster.map((p) => {
    const counts = {};
    recent.forEach((run) => run.orders.forEach((o) => {
      if (o.who === p.name) counts[o.drink] = (counts[o.drink] || 0) + 1;
    }));
    const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 3);
    return ranked.length ? { ...p, usuals: ranked } : p;
  });
}

/* ---------- app ---------- */
function App() {
  const [roster, setRoster] = useState(() => store.get(K.roster, []));
  const [history, setHistory] = useState(() => store.get(K.history, []));
  const [picked, setPicked] = useState(() => store.get(K.draft, {}));
  const [extras, setExtras] = useState([]);
  const [screen, setScreen] = useState("who");
  const [sheet, setSheet] = useState(null);
  const [customs, setCustoms] = useState(() => store.get(K.custom, []));
  const [groups, setGroups] = useState(() => store.get(K.groups, []));
  const [group, setGroup] = useState(() => store.get(K.active, ""));

  useEffect(() => store.set(K.custom, customs), [customs]);
  useEffect(() => store.set(K.groups, groups), [groups]);
  useEffect(() => store.set(K.active, group), [group]);
  /* a deleted or renamed group must never leave the roster invisible */
  useEffect(() => { if (group && groups.indexOf(group) === -1) setGroup(""); }, [groups, group]);
  useEffect(() => store.set(K.roster, roster), [roster]);
  useEffect(() => store.set(K.history, history), [history]);
  useEffect(() => store.set(K.draft, picked), [picked]);

  const orders = useMemo(() => [
    ...Object.keys(picked).map((who) => ({ who, drink: picked[who] })),
    ...extras.map((d) => ({ who: null, drink: d })),
  ], [picked, extras]);

  const lines = useMemo(() => {
    const m = new Map();
    orders.forEach((o) => { if (!m.has(o.drink)) m.set(o.drink, []); m.get(o.drink).push(o.who); });
    return [...m.entries()].map(([line, who]) => ({ line, who })).sort((a, b) => b.who.length - a.who.length);
  }, [orders]);

  function toggle(name) {
    setPicked((p) => {
      if (p[name]) { const q = { ...p }; delete q[name]; return q; }
      const person = roster.find((r) => r.name === name);
      return { ...p, [name]: person.usuals[0] };
    });
  }
  function setDrink(name, drink) { setPicked((p) => ({ ...p, [name]: drink })); setSheet(null); }
  function addPerson(name, drink) {
    setRoster((r) => r.some((x) => x.name === name) ? r : [...r, { name, usuals: [drink] }]);
    setPicked((p) => ({ ...p, [name]: drink }));
    setSheet(null);
  }
  function addExtra(d) { setExtras((e) => [...e, d]); setSheet(null); }

  /* Merge, never replace — a colleague importing your roster keeps their own. */
  function setPersonGroups(name, gs) {
    setRoster((r) => r.map((p) => (p.name === name ? { ...p, groups: gs } : p)));
  }
  function addGroup(name) {
    const n = clean(name);
    if (!n) return;
    setGroups((g) => (g.some((x) => x.toLowerCase() === n.toLowerCase()) ? g : [...g, n]));
  }
  function removeGroup(name) {
    setGroups((g) => g.filter((x) => x !== name));
    setRoster((r) => r.map((p) => ({ ...p, groups: (p.groups || []).filter((x) => x !== name) })));
  }

  function mergeShare(inc) {
    setRoster((r) => {
      const out = r.map((x) => ({ ...x, usuals: x.usuals.slice() }));
      inc.people.forEach((p) => {
        const ex = out.find((x) => x.name.toLowerCase() === p.name.toLowerCase());
        if (!ex) out.push({ name: p.name, usuals: p.usuals.slice(0, 3) });
        else p.usuals.forEach((u) => { if (ex.usuals.indexOf(u) === -1 && ex.usuals.length < 3) ex.usuals.push(u); });
      });
      return out;
    });
    setCustoms((c) => {
      const out = c.slice();
      inc.cust.forEach((x) => { if (!out.some((y) => y.toLowerCase() === x.toLowerCase())) out.push(x); });
      return out.slice(0, 20);
    });
    if (inc.groups && inc.groups.length) {
      setGroups((g) => {
        const out = g.slice();
        inc.groups.forEach((x) => { if (!out.some((y) => y.toLowerCase() === x.name.toLowerCase())) out.push(x.name); });
        return out;
      });
      setRoster((r) => r.map((p) => {
        const belongs = inc.groups.filter((x) => x.members.some((m) => m.toLowerCase() === p.name.toLowerCase()));
        if (!belongs.length) return p;
        const gs = (p.groups || []).slice();
        belongs.forEach((x) => { if (gs.indexOf(x.name) === -1) gs.push(x.name); });
        return { ...p, groups: gs };
      }));
    }
  }

  /* Keep it, most recent first, matched case-insensitively so "100 plus"
     lands on the existing "100 Plus" instead of forking the tally. */
  function noteCustom(line) {
    setCustoms((c) => {
      const hit = c.find((x) => x.toLowerCase() === line.toLowerCase());
      return [hit || line, ...c.filter((x) => x.toLowerCase() !== line.toLowerCase())].slice(0, 20);
    });
  }

  function closeRun() {
    if (!orders.length) return;
    const run = { ts: Date.now(), orders: orders.filter((o) => o.who) };
    const nh = [...history, run].slice(-60);
    setHistory(nh);
    setRoster((r) => relearn(r, nh));
    setPicked({}); setExtras([]); setScreen("who");
  }

  return html`
    <div class="app">
      <header>
        <div class="brand">Kopitiam Run</div>
        <nav>
          ${[["who", "Who's in"], ["drink", "By drink"], ["counter", "Counter"], ["back", "Hand back"], ["set", "Setup"]].map(
            ([id, l]) => html`<button class=${"tab" + (screen === id ? " on" : "")} onClick=${() => setScreen(id)}>${l}</button>`
          )}
        </nav>
      </header>

      ${!standalone && html`<${InstallBanner} />`}
      ${screen === "who" && html`<${Who} ...${{ roster, picked, extras, setExtras, orders, lines, toggle, setSheet, setScreen, groups, group, setGroup }} />`}
      ${screen === "drink" && html`<${ByDrink} roster=${roster.filter((p) => inGroup(p, group))} picked=${picked} customs=${customs}
        noteCustom=${noteCustom} setScreen=${setScreen}
        onAssign=${(who, line) => setPicked((p) => ({ ...p, [who]: line }))}
        onOneOff=${(line) => setExtras((e) => [...e, line])} />`}
      ${screen === "counter" && html`<${Counter} lines=${lines} onDone=${() => setScreen("back")} />`}
      ${screen === "back" && html`<${HandBack} orders=${orders} onClose=${closeRun} />`}
      ${screen === "set" && html`<${Setup} ...${{ roster, setRoster, history, setHistory, customs, mergeShare,
        groups, addGroup, removeGroup, setPersonGroups }} />`}

      ${sheet && sheet.mode === "change" && html`
        <${ChangeSheet} person=${roster.find((r) => r.name === sheet.name)} current=${picked[sheet.name]}
          customs=${customs} noteCustom=${noteCustom}
          onPick=${(d) => setDrink(sheet.name, d)} onCancel=${() => setSheet(null)} />`}
      ${sheet && sheet.mode === "new" && html`
        <${NewSheet} customs=${customs} noteCustom=${noteCustom}
          onAdd=${addPerson} onExtra=${addExtra} onCancel=${() => setSheet(null)} />`}
    </div>`;
}

/* ---------- install nag: the roster is not safe until this is gone ---------- */
function InstallBanner() {
  const [hide, setHide] = useState(false);
  if (hide) return null;
  return html`
    <div class="nag">
      <strong>Running in the browser — your roster is not safe here.</strong>
      <p>${isIOS
        ? "Safari deletes stored data after 7 days without a visit. Home Screen apps are exempt. Tap the Share button, then Add to Home Screen, and open it from there from now on."
        : "Install the app from your browser menu so its data gets its own storage."}</p>
      <button class="link" onClick=${() => setHide(true)}>Dismiss for now</button>
    </div>`;
}

/* ---------- roster screen ---------- */
function Who({ roster, picked, extras, setExtras, orders, lines, toggle, setSheet, setScreen, groups, group, setGroup }) {
  const shown = roster.filter((p) => inGroup(p, group));
  /* someone can be picked and then filtered out of view — say so, don't hide it */
  const offscreen = Object.keys(picked).filter((n) => {
    const p = roster.find((x) => x.name === n);
    return p && !inGroup(p, group);
  }).length;
  const off = Object.keys(picked).filter((n) => {
    const p = roster.find((r) => r.name === n);
    return p && p.usuals.indexOf(picked[n]) === -1;
  }).length;

  if (!roster.length) return html`
    <main>
      <div class="empty">
        <h2>Nobody on the roster yet</h2>
        <p>Add people as you go on the next couple of runs. After that, one tap each is all it takes —
        the app works out everyone's usual from what they actually ordered.</p>
        <button class="primary" onClick=${() => setSheet({ mode: "new" })}>Add the first person</button>
        <button class="ghost" onClick=${() => setScreen("drink")}>Or just order drinks, no names</button>
      </div>
    </main>`;

  return html`
    <main>
      <div class="topline">
        <div>
          <div class="big">${orders.length}<span> in</span></div>
          <div class="sub">${lines.length} lines${off ? ` · ${off} not their usual` : ""}</div>
        </div>
        <div class="hint">Grey = not tapped yet</div>
      </div>

      ${groups.length > 0 && html`
        <div class="chips groupbar">
          <button class=${"chip grp" + (group ? "" : " on")} onClick=${() => setGroup("")}>
            Everyone · ${roster.length}
          </button>
          ${groups.map((g) => html`
            <button class=${"chip grp" + (group === g ? " on" : "")} onClick=${() => setGroup(g)}>
              ${g} · ${roster.filter((p) => inGroup(p, g)).length}
            </button>`)}
        </div>
        ${offscreen > 0 && html`<div class="note warnline">${offscreen} ${offscreen === 1 ? "person" : "people"} in this run ${offscreen === 1 ? "is" : "are"} outside ${group} — still counted, tap Everyone to see ${offscreen === 1 ? "them" : "them"}.</div>`}`}

      <div class="grid">
        ${shown.map((p) => {
          const d = picked[p.name];
          const on = !!d;
          const changed = on && p.usuals.indexOf(d) === -1;
          return html`
            <div class=${"card" + (on ? " on" : "") + (changed ? " changed" : "")}>
              <button class="cardmain" onClick=${() => toggle(p.name)}>
                <div class="name">${p.name}</div>
                <div class="drinkrow">
                  <${DrinkIcon} line=${d || p.usuals[0]} size=${24} />
                  <span class="drink">${d || p.usuals[0]}</span>
                </div>
              </button>
              ${on && html`<button class="edit" onClick=${() => setSheet({ mode: "change", name: p.name })}>✎</button>`}
            </div>`;
        })}
        <button class="card add" onClick=${() => setSheet({ mode: "new" })}>
          <div class="name">+ Someone else</div>
          <div class="drink">New person, or a spare</div>
        </button>
        ${group && shown.length === 0 && html`
          <div class="card add" style="grid-column:1/-1">
            <div class="name">Nobody in ${group} yet</div>
            <div class="drink">Setup → Groups to add people</div>
          </div>`}
      </div>

      ${extras.length > 0 && html`
        <div class="panel">
          <div class="label">Spare drinks, no owner</div>
          ${extras.map((d, i) => html`
            <div class="row">
              <span class="drinkrow"><${DrinkIcon} line=${d} size=${22} />${d}</span>
              <button class="link" onClick=${() => setExtras((x) => x.filter((_, k) => k !== i))}>remove</button>
            </div>`)}
        </div>`}

      <button class="primary" disabled=${!orders.length} onClick=${() => setScreen("counter")}>
        Done — show at counter
      </button>
    </main>`;
}

/* ---------- sheets ---------- */
function Shell({ title, children, onCancel }) {
  return html`
    <div class="scrim" onClick=${(e) => e.target.className === "scrim" && onCancel()}>
      <div class="sheet">
        <div class="sheethead"><h3>${title}</h3><button class="link" onClick=${onCancel}>Cancel</button></div>
        ${children}
      </div>
    </div>`;
}

function ChangeSheet({ person, current, onPick, onCancel, customs, noteCustom }) {
  const [building, setBuilding] = useState(false);
  if (!person) return null;
  if (building) return html`<${Builder} title=${person.name + " — today"} customs=${customs}
    noteCustom=${noteCustom} onCancel=${() => setBuilding(false)} onAdd=${onPick} />`;
  return html`
    <${Shell} title=${person.name + " wants something else"} onCancel=${onCancel}>
      <div class="label">Their usual drinks</div>
      <div class="stack">
        ${person.usuals.map((u) => html`
          <button class=${"opt" + (u === current ? " on" : "")} onClick=${() => onPick(u)}>${u}</button>`)}
      </div>
      <button class="ghost" onClick=${() => setBuilding(true)}>Build something different</button>
    <//>`;
}

function NewSheet({ onAdd, onExtra, onCancel, customs, noteCustom }) {
  const [name, setName] = useState("");
  const [mode, setMode] = useState(null);
  if (mode === "person") return html`<${Builder} title=${"What does " + name + " have?"} customs=${customs}
    noteCustom=${noteCustom} onCancel=${() => setMode(null)} onAdd=${(d) => onAdd(name.trim(), d)} />`;
  if (mode === "extra") return html`<${Builder} title="Spare drink, no owner" customs=${customs}
    noteCustom=${noteCustom} onCancel=${() => setMode(null)} onAdd=${onExtra} />`;
  return html`
    <${Shell} title="Someone else" onCancel=${onCancel}>
      <input value=${name} placeholder="Name" onInput=${(e) => setName(e.target.value)} />
      <button class="primary" disabled=${!name.trim()} onClick=${() => setMode("person")}>Add to roster</button>
      <div class="note">They become a card next time, with this as their usual.</div>
      <button class="ghost" onClick=${() => setMode("extra")}>Just a spare drink, nobody's</button>
    <//>`;
}

function Composer({ customs, d, setD, free, setFree, onQuick }) {
  const b = d.base ? baseOf(d.base) : null;
  const typed = tidy(free);
  return html`
    ${customs && customs.length > 0 && html`
      <div class="label">Off the menu</div>
      <div class="chips">
        ${customs.map((c) => html`
          <button class="chip" onClick=${() => onQuick(c)}>
            <${DrinkIcon} line=${c} size=${20} />${c}
          </button>`)}
      </div>`}

    <div class="label">Build one</div>
    <div class=${"bases" + (typed ? " dim" : "")}>
      ${BASES.map((x) => html`
        <button class=${"opt sm base" + (d.base === x.id ? " on" : "")} disabled=${!!typed}
          onClick=${() => setD({ base: x.id, milk: "", sugar: "", strength: "", peng: false })}>
          <${DrinkIcon} line=${x.id} size=${26} />${x.id}
        </button>`)}
    </div>
    <div class=${"mods" + (b && !typed ? "" : " dim")}>
      ${GROUPS.map((g) => html`
        <div class="modrow">
          ${g.cards.map(([val, note]) => {
            const dead = !b || !b[g.gate] || !!typed;
            const on = d[g.key] === val;
            return html`<button class=${"opt sm" + (on ? " on" : "")} disabled=${dead}
              onClick=${() => setD((p) => ({ ...p, [g.key]: p[g.key] === val ? "" : val }))}>
              ${val}<em>${note}</em></button>`;
          })}
        </div>`)}
      <div class="modrow">
        <button class=${"opt sm" + (d.peng ? " on" : "")} disabled=${!b || !!typed}
          onClick=${() => setD((p) => ({ ...p, peng: !p.peng }))}>Peng<em>iced</em></button>
      </div>
    </div>

    <div class="label">Or just type it</div>
    <input value=${free} placeholder="Calamansi ice lemon tea, 100 Plus…"
      onInput=${(e) => setFree(e.target.value)} />`;
}

function Builder({ title, onAdd, onCancel, customs, noteCustom }) {
  const [d, setD] = useState({ base: null, milk: "", sugar: "", strength: "", peng: false });
  const [free, setFree] = useState("");
  const typed = tidy(free);
  const line = typed || (d.base ? recite(d) : "");
  const use = (text, isFree) => { if (isFree) noteCustom(text); onAdd(text); };

  return html`
    <${Shell} title=${title} onCancel=${onCancel}>
      <${Composer} customs=${customs} d=${d} setD=${setD} free=${free} setFree=${setFree}
        onQuick=${(c) => use(c, true)} />
      <div class="note">Anything the buttons can't say. It becomes a chip up top next time.</div>
      <div class="preview">
        <${DrinkIcon} line=${line} size=${38} />
        <div><span>The stall will hear</span><strong>${line || "—"}</strong></div>
      </div>
      <button class="primary" disabled=${!line} onClick=${() => use(line, !!typed)}>Use this</button>
    <//>`;
}

/* ---------- drink-first tab: build it, then decide whose it is ---------- */
function ByDrink({ roster, picked, customs, noteCustom, onAssign, onOneOff, setScreen }) {
  const [d, setD] = useState({ base: null, milk: "", sugar: "", strength: "", peng: false });
  const [free, setFree] = useState("");
  const typed = tidy(free);
  const line = typed || (d.base ? recite(d) : "");

  function commit(who) {
    if (!line) return;
    if (typed) noteCustom(line);
    if (who) onAssign(who, line); else onOneOff(line);
    setD({ base: null, milk: "", sugar: "", strength: "", peng: false });
    setFree("");
  }

  return html`
    <main>
      <h2>Order by drink</h2>
      <div class="sub">For guests, spares, or before anyone is on the roster.</div>

      <${Composer} customs=${customs} d=${d} setD=${setD} free=${free} setFree=${setFree}
        onQuick=${(c) => { setFree(c); setD({ base: null, milk: "", sugar: "", strength: "", peng: false }); }} />

      <div class="preview">
        <${DrinkIcon} line=${line} size=${38} />
        <div><span>The stall will hear</span><strong>${line || "—"}</strong></div>
      </div>

      ${line && html`
        <div class="label">Whose is it?</div>
        <div class="chips">
          <button class="chip oneoff" onClick=${() => commit(null)}>One-off · no name</button>
          ${roster.map((p) => html`
            <button class=${"chip name" + (picked[p.name] ? " taken" : "")}
              onClick=${() => commit(p.name)}>${p.name}${picked[p.name] ? " ✓" : ""}</button>`)}
        </div>
        <div class="note">Tapping a name that already has a drink replaces it.</div>`}

      <button class="ghost" onClick=${() => setScreen("who")}>Back to the roster</button>
    </main>`;
}

/* ---------- counter ---------- */
/* The uncle makes drinks in batches by type, and asks aggregate questions
   ("how many teh o peng?"). Sorting by quantity scattered the variants of one
   base across the deck, so answering meant paging back and remembering. One
   card per base now, with every variant of it visible at once. */
function families(lines) {
  const order = BASES.map((b) => b.id);
  const m = new Map();
  lines.forEach((l) => {
    const p = parseDrink(l.line);
    const key = p ? p.base : "Off the menu";
    if (!m.has(key)) m.set(key, { base: key, items: [], total: 0 });
    const f = m.get(key);
    f.items.push(l);
    f.total += l.who.length;
  });
  const arr = [...m.values()];
  /* canonical order within a base keeps neighbours together: plain, C…, O… */
  arr.forEach((f) => f.items.sort((a, b) => a.line.localeCompare(b.line)));
  arr.sort((a, b) => {
    const ia = order.indexOf(a.base), ib = order.indexOf(b.base);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return arr;
}

function Counter({ lines, onDone }) {
  const [i, setI] = useState(0);
  const [mode, setMode] = useState("read");
  /* how many of each line are physically on the counter, keyed by the line text */
  const [here, setHere] = useState({});
  const fam = useMemo(() => families(lines), [lines]);

  const total = lines.reduce((n, l) => n + l.who.length, 0);
  const got = Object.keys(here).reduce((n, k) => n + here[k], 0);
  const allHere = total > 0 && got >= total;

  function setCount(line, n) { setHere((h) => ({ ...h, [line]: n })); }

  if (!fam.length) return html`<main><div class="empty"><p>Nobody tapped yet.</p></div></main>`;

  const tabs = html`
    <div class="modebar">
      <button class=${"mtab" + (mode === "read" ? " on" : "")} onClick=${() => setMode("read")}>Read out</button>
      <button class=${"mtab" + (mode === "check" ? " on" : "")} onClick=${() => setMode("check")}>
        On the counter · ${got}/${total}
      </button>
    </div>`;

  /* ---- check off what has actually landed ---- */
  if (mode === "check") {
    return html`
      <div class="dark">
        ${tabs}
        <div class=${"tally" + (allHere ? " ok" : "")}>
          <span class="tallynum">${got}<em>/${total}</em></span>
          <span class="tallytxt">${allHere ? "All here — you can go" : "on the counter"}</span>
        </div>

        <div class="checklist">
          ${fam.map((f) => html`
            <div class="checkfam">${f.base === "Off the menu" ? "Off the menu" : f.base}</div>
            ${f.items.map((it) => {
              const n = here[it.line] || 0;
              return html`
                <div class=${"checkrow" + (n >= it.who.length ? " full" : "")}>
                  <div class="checkhead">
                    <${DrinkIcon} line=${it.line} size=${26} />
                    <span class="checkline">${it.line}</span>
                    <span class="checkqty">${n}/${it.who.length}</span>
                  </div>
                  <div class="dots">
                    ${Array.from({ length: it.who.length }).map((_, k) => html`
                      <button class=${"dot" + (k < n ? " on" : "")}
                        aria-label=${(k < n ? "unmark " : "mark ") + it.line}
                        onClick=${() => setCount(it.line, k + 1 === n ? k : k + 1)}>${k < n ? "✓" : ""}</button>`)}
                  </div>
                </div>`;
            })}`)}
        </div>

        <button class=${allHere ? "primary" : "ghostdark"} onClick=${onDone}>
          ${allHere ? "All here — hand them back" : "Go anyway · " + (total - got) + " still missing"}
        </button>
      </div>`;
  }

  /* ---- read the order out ---- */
  if (i >= fam.length) return html`
    <div class="dark">
      ${tabs}
      <h2>That's everything.</h2>
      <div class="donerecap">
        ${fam.map((f) => html`<div><b>${f.total}</b> ${f.base === "Off the menu" ? "off the menu" : f.base}</div>`)}
      </div>
      <button class="primary" onClick=${() => setMode("check")}>Tick them off as they arrive</button>
      <button class="ghostdark" onClick=${() => setI(0)}>Read again</button>
    </div>`;

  const f = fam[i];
  const solo = f.items.length === 1;

  return html`
    <div class="dark">
      ${tabs}
      <div class="progress">
        <span>${f.base} · ${i + 1} of ${fam.length}</span>
        <span>${fam.length - i - 1} more</span>
      </div>

      <button class="bigline" onClick=${() => setI(i + 1)}>
        <div class="famhead">
          <span class="famname">${f.base}</span>
          <span class="famtotal">${f.total}</span>
        </div>

        ${solo
          ? html`
            <div class="sololine">
              <${DrinkIcon} line=${f.items[0].line} size=${52} />
              <span>${f.items[0].line}</span>
            </div>
            <div class="whos">${f.items[0].who.filter(Boolean).join(" · ")}</div>`
          : f.items.map((it) => html`
            <div class="varrow">
              <span class="varqty">${it.who.length}</span>
              <${DrinkIcon} line=${it.line} size=${30} />
              <span class="varline">${it.line}</span>
            </div>
            <div class="varwho">${it.who.filter(Boolean).join(" · ")}</div>`)}

        <div class="tapme">${f.base === "Off the menu"
          ? "Tap when the uncle has these"
          : "Tap when the uncle has all the " + f.base.toLowerCase()}</div>
      </button>

      <button class="ghostdark" onClick=${() => setI(Math.max(0, i - 1))}>He asked again</button>
    </div>`;
}

/* ---------- hand back ---------- */
function HandBack({ orders, onClose }) {
  const [done, setDone] = useState([]);
  return html`
    <main>
      <h2>Whose cup is whose</h2>
      <div class="sub">${done.length} of ${orders.length} handed out</div>
      <div class="list">
        ${orders.map((o, i) => {
          const on = done.indexOf(i) > -1;
          return html`
            <button class=${"listrow" + (on ? " done" : "")}
              onClick=${() => setDone((d) => on ? d.filter((x) => x !== i) : [...d, i])}>
              <span class="box">${on ? "✓" : ""}</span>
              <${DrinkIcon} line=${o.drink} size=${28} />
              <span><strong>${o.who || "Spare"}</strong><em>${o.drink}</em></span>
            </button>`;
        })}
      </div>
      <button class="primary" onClick=${onClose}>Finish run and learn from it</button>
      <div class="note">Closing the run updates everyone's usual from what they actually took.</div>
    </main>`;
}

/* ---------- setup / backup ---------- */
function Setup({ roster, setRoster, history, setHistory, customs, mergeShare,
                 groups, addGroup, removeGroup, setPersonGroups }) {
  const [io, setIo] = useState("");
  const [grant, setGrant] = useState(null);
  const [showQR, setShowQR] = useState(false);
  const [msg, setMsg] = useState("");
  const [newG, setNewG] = useState("");
  const [scope, setScope] = useState("");
  const [editing, setEditing] = useState(null);
  const dump = JSON.stringify({ roster, history });

  /* sharing one group instead of everyone is the point — smaller code, less clutter */
  const scoped = scope ? roster.filter((p) => inGroup(p, scope)) : roster;
  const scopedGroups = scope ? [scope] : groups;
  const full = encodeShare(scoped, customs, 3, scopedGroups);
  const qr = bestShare(scoped, customs, scopedGroups);
  const canScan = typeof window !== "undefined" && "BarcodeDetector" in window;

  useEffect(() => {
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(setGrant).catch(() => setGrant(null));
    }
  }, []);

  function receive(text) {
    const inc = decodeShare(text);
    if (!inc) { setMsg("That doesn't look like a Kopi Run code."); return; }
    mergeShare(inc);
    setIo("");
    setMsg("Added " + inc.people.length + " " + (inc.people.length === 1 ? "person" : "people") +
      (inc.cust.length ? " and " + inc.cust.length + " off-menu drinks" : "") + ". Nothing of yours was replaced.");
  }

  function restore() {
    try {
      const o = JSON.parse(io);
      if (Array.isArray(o.roster)) setRoster(o.roster);
      if (Array.isArray(o.history)) setHistory(o.history);
      setIo(""); setMsg("Full backup restored.");
    } catch (e) { setMsg("That isn't a valid backup."); }
  }

  async function scan() {
    setMsg("");
    try {
      const det = new window.BarcodeDetector({ formats: ["qr_code"] });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const v = document.createElement("video");
      v.srcObject = stream; v.setAttribute("playsinline", ""); await v.play();
      const stop = () => stream.getTracks().forEach((t) => t.stop());
      const t0 = Date.now();
      const tick = async () => {
        if (Date.now() - t0 > 20000) { stop(); setMsg("Nothing found — try the paste box."); return; }
        try {
          const codes = await det.detect(v);
          if (codes.length) { stop(); receive(codes[0].rawValue); return; }
        } catch (e) {}
        requestAnimationFrame(tick);
      };
      tick();
      setMsg("Point the camera at their code…");
    } catch (e) { setMsg("Couldn't open the camera."); }
  }

  return html`
    <main>
      <h2>Setup</h2>
      ${!persisted && html`<div class="warn">This browser is blocking storage. Your roster will vanish when you close the tab. Use the backup box below.</div>`}

      <div class="label">Storage</div>
      <div class=${"status " + (standalone ? "ok" : "bad")}>
        <strong>${standalone ? "Installed on the Home Screen" : "Running in the browser"}</strong>
        <span>${standalone
          ? "Exempt from Safari's 7-day data wipe. This is where the roster belongs."
          : "At risk. Share → Add to Home Screen, then open it from the icon."}</span>
      </div>
      <div class="note">
        Persistent-storage grant: ${grant === null ? "unknown" : grant ? "yes" : "not granted"}.
        ${" "}Deleting the Home Screen icon deletes the roster with it, and iCloud does not back it up.
      </div>

      <div class="label">Groups</div>
      <div class="chips">
        ${groups.map((g) => html`
          <span class="chip grp static">${g} · ${roster.filter((p) => inGroup(p, g)).length}
            <button class="x" onClick=${() => confirm("Delete the group " + g + "? Nobody is removed from the roster.") && removeGroup(g)}>×</button>
          </span>`)}
        ${groups.length === 0 && html`<span class="note">No groups yet. Everyone shows on one screen.</span>`}
      </div>
      <div class="btnrow">
        <input value=${newG} placeholder="New group, e.g. Plant 5" onInput=${(e) => setNewG(e.target.value)} />
        <button class="ghost" disabled=${!newG.trim()} onClick=${() => { addGroup(newG); setNewG(""); }}>Add</button>
      </div>
      <div class="note">A person can sit in more than one group. Tap anyone below to set theirs.</div>

      <div class="label">Give your roster to a colleague</div>
      ${groups.length > 0 && html`
        <div class="chips">
          <button class=${"chip grp" + (scope ? "" : " on")} onClick=${() => setScope("")}>Everyone</button>
          ${groups.map((g) => html`
            <button class=${"chip grp" + (scope === g ? " on" : "")} onClick=${() => setScope(g)}>${g}</button>`)}
        </div>`}
      <button class="ghost" onClick=${() => setShowQR(!showQR)}>
        ${showQR ? "Hide the code" : "Show the code"} · ${scoped.length} people
      </button>
      ${showQR && html`
        <div class="qrbox">
          ${qr.fits
            ? html`<${QRSvg} text=${qr.text} size=${260} />`
            : html`<div class="warn">Too many people for one QR code. Send the text below instead.</div>`}
          ${qr.note && html`<div class="note">${qr.note}</div>`}
          <div class="note">
            They scan this with their iPhone Camera, tap <b>Copy</b>, then paste it into
            the box below in their own app. Or just AirDrop them the text.
          </div>
          <textarea readonly onFocus=${(e) => e.target.select()} value=${full}></textarea>
        </div>`}
      <div class="note">
        Sends people and their usuals, not your run history — the usuals already are
        the history, boiled down. Their app keeps learning from their own runs.
      </div>

      <div class="label">Receive from someone</div>
      ${canScan
        ? html`<button class="ghost" onClick=${scan}>Scan their code with the camera</button>`
        : html`<div class="note">Safari has no camera-scanning API, so in-app scanning
            can't work on iPhone. Use the iPhone <b>Camera</b> app on their code, tap
            <b>Copy</b>, then paste below.</div>`}
      <textarea placeholder="Paste a KR1 code, or a full backup" value=${io}
        onInput=${(e) => setIo(e.target.value)}></textarea>
      <div class="btnrow">
        <button class="ghost" disabled=${!io.trim()} onClick=${() => receive(io)}>Add to my roster</button>
        <button class="ghost" disabled=${!io.trim()} onClick=${restore}>Restore full backup</button>
      </div>
      ${msg && html`<div class="status ok"><strong>${msg}</strong></div>`}

      <div class="label">Your people · ${roster.length}, from ${history.length} runs</div>
      <div class="list">
        ${roster.map((p) => html`
          <div class="listrow static">
            <button class="rowmain" onClick=${() => groups.length ? setEditing(p.name) : null}>
              <strong>${p.name}</strong>
              <em>${p.usuals.join(" / ")}</em>
              ${groups.length > 0 && html`<em class="tags">${(p.groups || []).length ? (p.groups || []).join(" · ") : "no group"}</em>`}
            </button>
            <button class="link" onClick=${() => confirm("Remove " + p.name + "?") && setRoster((r) => r.filter((x) => x.name !== p.name))}>remove</button>
          </div>`)}
      </div>

      ${editing && html`
        <${Shell} title=${"Groups for " + editing} onCancel=${() => setEditing(null)}>
          <div class="stack">
            ${groups.map((g) => {
              const on = inGroup(roster.find((x) => x.name === editing) || {}, g);
              return html`<button class=${"opt" + (on ? " on" : "")} onClick=${() => {
                const p = roster.find((x) => x.name === editing);
                const gs = (p.groups || []).slice();
                const i = gs.indexOf(g);
                if (i > -1) gs.splice(i, 1); else gs.push(g);
                setPersonGroups(editing, gs);
              }}>${on ? "✓ " : ""}${g}</button>`;
            })}
          </div>
          <button class="primary" onClick=${() => setEditing(null)}>Done</button>
        <//>`}

      <div class="label">Full backup</div>
      <div class="note">Everything, history included. Copy it into Notes once a month — it's the only copy that exists.</div>
      <textarea readonly onFocus=${(e) => e.target.select()} value=${dump}></textarea>
    </main>`;
}

render(html`<${App} />`, document.getElementById("root"));

</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
